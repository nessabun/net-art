<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Really Cool Website</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="intro">
        <p class="header">A really cool website</p>
        <h1>Your consent is our priority.</h1>
        <p>We use cookies to improve your experience.</p>
    </header>

    <p class="counter" id="cookie-count">Cookies: 0/5</p>

    <div class="serving" id="serving">
        <img src="images/plate.png">
    </div>

    <div class="speech" id="speech"></div>
    <img class="guy" id="guy" src="images/guy1.png">

    <div class="controls" id="controls" hidden>
        <button class="accept" id="accept-button" type="button">Accept cookies</button>
        <button class="decline" id="decline-button" type="button">Decline</button>
    </div>

    <p class="small-note">Totally standard site data. Definitely not a trap.</p>

<!-- is it dialogue or dialog? maybe i'm too colonized -->
    <section class="dialogue" id="consent-dialogue" role="dialoguebox">
        <div class="dialogue-card">
            <h2 id="consent-title">A quick note</h2>
            <p>We use cookies to improve your experience with us. By accepting, you consent to our use of cookies.</p>
        </div class="dialogue-actions">
        <button class="accept" id="consent-accept" type="button">Accept</button>
        <button class="decline" id="consent-decline" type="button">Decline</button>
        </div>
        </div>
    </section>

<section class="dialogue" id="dialogue" role="dialoguebox">
    <div class="dialogue-card">
        <h2 id="dialogue-title">Are you sure?</h2>
        <p id="dialogue-copy"></p>
        <div class="dialogue-actions" id="dialogue-actions"></div>
    </div>
</section>

 <script src="js/cookie.js" defer></script>
</body>

</html>
